name: Servidor — uso e trava (ferramenta)
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://fui-do-templo-a-pk-2.denilsinend.workers.dev
          A='Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36'
          echo USO; curl -s -A "$A" $U/fs-admin/uso; echo
          echo QUERY; curl -s -A "$A" -H 'Content-Type: application/json' -d '{"structuredQuery":{"from":[{"collectionId":"torre"}],"where":{"fieldFilter":{"field":{"fieldPath":"lei"},"op":"EQUAL","value":{"stringValue":"1"}}},"limit":1}}' "$U/fs/v1/projects/furia-do-templo/databases/(default)/documents:runQuery" | head -c 400; echo
          echo ERROS; curl -s -A "$A" "$U/fs-admin/erros?h=36" | sed 's/<div/\n<div/g' | sed 's/<[^>]*>/ /g' | head -c 20000; echo
          echo TEMPO; time curl -s -o /tmp/t.json -w '%{http_code} %{size_download}\n' -A "$A" -H 'Content-Type: application/json' -d '{"structuredQuery":{"from":[{"collectionId":"torre"}],"orderBy":[{"field":{"fieldPath":"pontos"},"direction":"DESCENDING"}],"limit":150}}' "$U/fs/v1/projects/furia-do-templo/databases/(default)/documents:runQuery"; head -c 300 /tmp/t.json; echo
          echo ANDAR11; curl -s -o /tmp/a.json -w '%{http_code} %{size_download} %{time_total}\n' -A "$A" -H 'Content-Type: application/json' -d '{"structuredQuery":{"from":[{"collectionId":"torre"}],"where":{"fieldFilter":{"field":{"fieldPath":"andar"},"op":"EQUAL","value":{"integerValue":"11"}}},"orderBy":[{"field":{"fieldPath":"tempo"},"direction":"ASCENDING"}],"limit":600}}' "$U/fs/v1/projects/furia-do-templo/databases/(default)/documents:runQuery"; python3 -c "import json;L=json.load(open('/tmp/a.json'));print(len(L));[print(d['document']['fields']['nome']['stringValue'],d['document']['fields']['tempo']['integerValue'],d['document']['fields'].get('v',{}).get('integerValue'),d['document']['createTime'][:16]) for d in L[:25] if 'document' in d]"
