name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Guardar o Gradle entre builds (evita baixar toda vez)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-8.2.1
      - name: Instalar Capacitor
        run: npm install
      - name: Criar projeto Android
        run: |
          npx cap add android
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:hardwareAccelerated="true" android:largeHeap="true"|' android/app/src/main/AndroidManifest.xml
          cp android-extra/MainActivity.java android/app/src/main/java/com/denilson/furiadotemplo/MainActivity.java
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties || true
          grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties || echo 'networkTimeout=120000' >> gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4 5; do ./gradlew assembleDebug && break; echo "tentativa $i falhou (internet do servidor), tentando de novo"; sleep 45; done
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Copiar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FuriaDoTemplo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FuriaDoTemplo-apk
          path: FuriaDoTemplo.apk
      - name: Publicar APK (release + branch apk)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima-versao -y --cleanup-tag || true
          gh release create ultima-versao FuriaDoTemplo.apk -t "Fúria do Templo — última versão" -n "Baixe o FuriaDoTemplo.apk abaixo e instale no celular."
          mkdir out && cp FuriaDoTemplo.apk out/ && cd out
          git init -q && git checkout -q -b apk && git add FuriaDoTemplo.apk
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk || echo "APK grande demais para o ramo apk; use a release ultima-versao"
