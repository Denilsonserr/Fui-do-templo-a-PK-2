name: Tempo de criar conta (ferramenta)
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: medir
        run: |
          S='https://fui-do-templo-a-pk-2.denilsinend.workers.dev';A='Mozilla/5.0 (Linux; Android 13) Chrome/120 Mobile';P="$S/fs/v1/projects/furia-do-templo/databases/(default)/documents"
          for i in 1 2 3; do echo "== acList $i"; curl -s -o /tmp/q.json -w 'HTTP %{http_code} em %{time_total}s\n' -A "$A" -H 'Content-Type: application/json' -d '{"structuredQuery":{"from":[{"collectionId":"torre"}],"where":{"fieldFilter":{"field":{"fieldPath":"sv"},"op":"EQUAL","value":{"stringValue":"teste000000000000000000'$i'"}}},"orderBy":[{"field":{"fieldPath":"__name__"},"direction":"DESCENDING"}],"limit":15}}' "$P:runQuery"; head -c 300 /tmp/q.json; echo; done
          echo "== save grande (300 KB)"; python3 -c "import json;print(json.dumps({'fields':{'nome':{'stringValue':'tstconta'},'andar':{'integerValue':'0'},'tempo':{'integerValue':'0'},'sv':{'stringValue':'testeconta000000000000'},'ts':{'integerValue':'1'},'d':{'stringValue':'x'*300000},'sg':{'stringValue':'a'},'v':{'integerValue':'220'}}}))" > /tmp/b.json
          curl -s -o /tmp/r.json -w 'HTTP %{http_code} em %{time_total}s\n' -A "$A" -H 'Content-Type: application/json' --data-binary @/tmp/b.json "$P/torre?documentId=tsttempo_$RANDOM$RANDOM"; head -c 300 /tmp/r.json; echo
          echo "== uso"; curl -s -A "$A" "$S/fs-admin/uso"; echo
          echo "== erros 6h"; curl -s -A "$A" "$S/fs-admin/erros?h=12" | sed 's/<div/\n<div/g' | sed 's/<[^>]*>/ /g' | head -c 6000
