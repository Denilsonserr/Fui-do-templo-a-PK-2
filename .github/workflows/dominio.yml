name: Checar dominio (ferramenta)
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: dns
        run: |
          for d in furiadotemplo.com.br www.furiadotemplo.com.br; do echo "== $d"; dig +short NS $d; dig +short A $d; dig +short CNAME $d; done
          echo "== rdap"; curl -s -m 15 https://rdap.registro.br/domain/furiadotemplo.com.br | python3 -c "import sys,json;d=json.load(sys.stdin);print('status',d.get('status'));print('ns',[n.get('ldhName') for n in d.get('nameservers',[])]);print('eventos',[(e.get('eventAction'),e.get('eventDate')) for e in d.get('events',[])])" || echo sem-rdap
          echo "== http"; for u in https://furiadotemplo.com.br/versao.txt https://www.furiadotemplo.com.br/versao.txt https://furiadotemplo.com.br/mig.js https://fui-do-templo-a-pk-2.denilsinend.workers.dev/versao.txt; do echo "$u -> $(curl -s -o /tmp/o -w '%{http_code} %{ssl_verify_result}' -m 20 $u 2>&1) $(head -c 40 /tmp/o 2>/dev/null)"; done
          curl -sv -m 20 https://furiadotemplo.com.br/versao.txt -o /dev/null 2>&1 | grep -iE "subject|issuer|expire|error|SSL" | head -8 || true
          echo "== mig"; c=$(curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"d":"{\"teste\":\"1\"}"}' https://fui-do-templo-a-pk-2.denilsinend.workers.dev/fs/mig-poe | python3 -c "import sys,json;print(json.load(sys.stdin).get('c',''))"); echo "codigo ${#c} chars"
          echo "pega1 $(curl -s -m 20 -X POST -H 'Content-Type: application/json' -d "{\"c\":\"$c\"}" https://furiadotemplo.com.br/fs/mig-pega)"
          echo "pega2 $(curl -s -o /dev/null -w '%{http_code}' -m 20 -X POST -H 'Content-Type: application/json' -d "{\"c\":\"$c\"}" https://furiadotemplo.com.br/fs/mig-pega)"
