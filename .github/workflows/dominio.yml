name: Checar dominio (ferramenta)
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: dns
        run: |
          for d in furiadotemplo.com.br www.furiadotemplo.com.br; do echo "== $d"; dig +short NS $d; dig +short A $d; dig +short CNAME $d; done
          echo "== rdap"; curl -s -m 15 https://rdap.registro.br/domain/furiadotemplo.com.br | python3 -c "import sys,json;d=json.load(sys.stdin);print('status',d.get('status'));print('ns',[n.get('ldhName') for n in d.get('nameservers',[])]);print('eventos',[(e.get('eventAction'),e.get('eventDate')) for e in d.get('events',[])])" || echo sem-rdap
          echo "== http"; curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" -m 15 https://furiadotemplo.com.br/ || true
