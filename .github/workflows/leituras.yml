name: Leituras do banco (ferramenta)
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: medir
        run: |
          S='https://fui-do-templo-a-pk-2.denilsinend.workers.dev';A='Mozilla/5.0 (Linux; Android 13) Chrome/120 Mobile'
          for i in 1 2 3 4 5 6; do curl -s -A "$A" "$S/fs-admin/reads"; echo; sleep 2; done
          echo "== tempos"; for u in "/" "/fs-admin/stats" ; do curl -s -o /dev/null -A "$A" -w "$u %{http_code} %{time_total}s\n" "$S$u"; done
