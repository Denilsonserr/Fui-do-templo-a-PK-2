name: Suspeitas 2 — quem gastou muitas gemas + linha do tempo (ferramenta)
on:
  workflow_dispatch:
    inputs:
      nomes: {description: 'nomes separados por virgula p/ linha do tempo', required: false, default: ''}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - env: {NOMES: '${{ github.event.inputs.nomes }}'}
        run: |
          cat > s.py <<'PY'
          import json,urllib.request,time,hashlib,os
          W='https://fui-do-templo-a-pk-2.denilsinend.workers.dev'
          B=W+'/fs/v1/projects/furia-do-templo/databases/(default)/documents'
          A={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36'}
          def get(u):
            for i in range(4):
              try:return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=A),timeout=60))
              except Exception as e:print('ERR',e);time.sleep(4)
          def rq(q):
            for i in range(4):
              try:return [x['document'] for x in json.load(urllib.request.urlopen(urllib.request.Request(B+':runQuery',data=json.dumps({'structuredQuery':q}).encode(),headers=dict(A,**{'Content-Type':'application/json'})),timeout=60)) if x.get('document')]
              except Exception as e:print('ERR q',e);time.sleep(5)
            return []
          def F(d):
            o={k:(list(v.values())[0]) for k,v in (d.get('fields') or {}).items()};o['_ct']=d.get('createTime','');return o
          acc=lambda n:hashlib.sha256(('furia|acc|'+n.lower().strip()).encode()).hexdigest()[:24]
          names=set()
          for f,v in (('mk','1'),):
            for d in rq({'from':[{'collectionId':'torre'}],'where':{'fieldFilter':{'field':{'fieldPath':f},'op':'EQUAL','value':{'stringValue':v}}},'limit':800}):
              n=F(d).get('nome');
              if n:names.add(n)
          for d in rq({'from':[{'collectionId':'torre'}],'orderBy':[{'field':{'fieldPath':'rgt'},'direction':'DESCENDING'}],'limit':800}):
            n=F(d).get('nome')
            if n:names.add(n)
          for d in rq({'from':[{'collectionId':'torre'}],'where':{'fieldFilter':{'field':{'fieldPath':'andar'},'op':'GREATER_THAN','value':{'integerValue':'0'}}},'limit':600}):
            n=F(d).get('nome')
            if n:names.add(n)
          AM={acc(n):n for n in names}
          print('NOMES CONHECIDOS',len(names))
          print('== GASTOS GRANDES DE GEMAS (act, dg>=15000) ==')
          X=[F(d) for d in rq({'from':[{'collectionId':'torre'}],'where':{'fieldFilter':{'field':{'fieldPath':'dg'},'op':'GREATER_THAN_OR_EQUAL','value':{'integerValue':'15000'}}},'limit':500})]
          for x in sorted(X,key=lambda x:x['_ct']):print(' ',x['_ct'][:19],'gastou',x.get('dg'),'conta',AM.get(x.get('act'),x.get('act')),'itens',(x.get('it') or '')[:80],'aneis',(x.get('an') or '')[:60])
          now=int(time.time()*1000)
          for n in [s.strip() for s in os.environ.get('NOMES','').split(',') if s.strip()]:
            print('== LINHA DO TEMPO',n,'==');last=None
            for hrs in range(0,49,2):
              s=get(W+'/fs/sv-antes?acc=%s&t=%d'%(acc(n),now-hrs*3600000+60000)) or {}
              if not s.get('d'):print('  -%dh sem save'%hrs);continue
              D=json.loads(s['d']);ts=s.get('ts')
              if ts==last:continue
              last=ts
              try:an=json.loads(D.get('rk_an','[]') or '[]')
              except:an=[]
              try:inv=json.loads(D.get('tw_inv','[]') or '[]')
              except:inv=[]
              print('  save',time.strftime('%d/%m %H:%M',time.gmtime(int(ts)/1000-3*3600)) if ts else '?','gem',D.get('rk_gem'),'aneis',len(an),'dour',sum(1 for x in an if x and x.get('c')==5),'inv',len(inv),'mk',sum(1 for x in inv if str(x.get('id','')).startswith('mk')),'pvp',D.get('rk_pvR','')[:30],'trn',D.get('rk_trn','')[:60])
              time.sleep(.3)
          PY
          python3 s.py
