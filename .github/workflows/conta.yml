name: Conta — mostra itens V2 de um jogador (ferramenta)
on:
  workflow_dispatch:
    inputs:
      nome: {description: 'nome da conta', required: true}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: conta
        env: {NOME: '${{ github.event.inputs.nome }}'}
        run: |
          python3 - <<'P'
          import json,urllib.request,os,hashlib,time
          U='https://fui-do-templo-a-pk-2.denilsinend.workers.dev'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36'}
          acc=hashlib.sha256(('furia|acc|'+os.environ['NOME'].lower().strip()).encode()).hexdigest()[:24]
          r=json.load(urllib.request.urlopen(urllib.request.Request(U+'/fs/sv-antes?acc=%s&t=%d'%(acc,int(time.time()*1000)+86400000),headers=H)))
          print('ACC',acc,'TS',r.get('ts'),'NADA' if r.get('nada') else '')
          D=json.loads(r.get('d') or '{}')
          inv=json.loads(D.get('tw_inv','[]') or '[]')
          print('INVTOTAL',len(inv))
          for it in inv:
            if it and (it.get('v2') or it.get('skb') or it.get('sk') or str(it.get('id','')).startswith('mk')):print('INV',json.dumps(it,ensure_ascii=False)[:700])
          for k in D:
            if 'eq' in k.lower() or k in ('rk_own','rk_ped','rk_pfF','rk_pff'):print('EQ',k,D[k][:1500])
          for k in ('rk_sjs','rk_sje','rk_urso','rk_lv','rk_lvl','rk_xp','rk_own','rk_sel','rk_ped','rk_gold','tw_moedas','rk_gem','rk_rkmax','tn_best','rk_sjT','rk_sjtr','rk_sjtrial','rk_cl','rk_ch'):
            if k in D:print('K',k,str(D[k])[:900])
          for k in D:
            if 'lv' in k.lower() or 'sj' in k.lower():print('L',k,str(D[k])[:400])
          an=json.loads(D.get('rk_an','[]') or '[]');print('ANEIS',len(an))
          for x in an:
            if x and x.get('c')==5:print('AN',json.dumps(x))
          print('ANEQ',D.get('rk_anEq','')[:600]);print('ACTS',D.get('rk_actS','')[:300]);print('FIX',D.get('rk_actFix',''));print('FIXHON',D.get('rk_fixHon1'))
          B='https://fui-do-templo-a-pk-2.denilsinend.workers.dev/fs/v1/projects/furia-do-templo/databases/(default)/documents'
          H2={'Content-Type':'application/json','User-Agent':H['User-Agent']}
          for fld in ('act','chx'):
            q={'structuredQuery':{'from':[{'collectionId':'torre'}],'where':{'fieldFilter':{'field':{'fieldPath':fld},'op':'EQUAL','value':{'stringValue':acc}}},'limit':500}}
            L=[x['document'] for x in json.load(urllib.request.urlopen(urllib.request.Request(B+':runQuery',data=json.dumps(q).encode(),headers=H2))) if x.get('document')]
            for d in L:print(fld.upper(),d['createTime'][:19],json.dumps({k:list(v.values())[0] for k,v in d['fields'].items()})[:400])
          print('KEYS',' '.join(sorted(D.keys())))
          P
