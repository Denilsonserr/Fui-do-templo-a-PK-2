name: Consulta livre (ferramenta)
on:
  workflow_dispatch:
    inputs:
      q: {description: 'structuredQuery JSON', required: true}
      campos: {description: 'campos para mostrar (virgula)', required: false, default: 'nome,uid'}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - env: {Q: '${{ github.event.inputs.q }}', C: '${{ github.event.inputs.campos }}'}
        run: |
          cat > c.py <<'PY'
          import json,urllib.request,os,collections
          U='https://fui-do-templo-a-pk-2.denilsinend.workers.dev/fs/v1/projects/furia-do-templo/databases/(default)/documents:runQuery'
          A={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36','Content-Type':'application/json'}
          q=json.loads(os.environ['Q']);C=[c for c in os.environ['C'].split(',') if c]
          R=json.load(urllib.request.urlopen(urllib.request.Request(U,data=json.dumps({'structuredQuery':q}).encode(),headers=A),timeout=90))
          D=[x['document'] for x in R if x.get('document')];print('DOCS',len(D))
          cnt=collections.Counter()
          for d in D:
            f={k:list(v.values())[0] for k,v in d['fields'].items()};cnt[f.get('nome')]+=1
            print(d['createTime'][:19],d['name'].split('/')[-1][:40],' | '.join(str(f.get(c,''))[:60] for c in C))
          print('POR NOME',cnt.most_common(60))
          PY
          python3 c.py
