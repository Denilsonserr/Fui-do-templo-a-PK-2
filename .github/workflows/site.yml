name: Publicar site (jogar no navegador)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar o jogo para a branch gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir site && cp -r www/. site/
          touch site/.nojekyll
          cd site
          git init -q && git checkout -q -b gh-pages && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "site"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
